server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agri-origin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: AgriHikariPool
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.agri.trace.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- JWT ----------------
jwt:
  secret: agri-origin-fisco-bcos-traceability-secret-key-2026
  expire-hours: 12
  header: Authorization
  prefix: "Bearer "

# ---------------- FISCO-BCOS ----------------
# enabled=false 为演示模式：业务可跑通，但所有存证标记为 SKIPPED，绝不伪造"存证成功"
chain:
  enabled: false
  config-file: classpath:fisco/config.toml
  group-id: 1
  contract-address: ""
  abi-path: classpath:contracts/Traceability.abi
  private-key: ""
  # true：上链失败抛出异常并回滚业务事务；false：落库但标记 FAILED
  strict: true
  timeout-ms: 5000

# ---------------- 本地文件存储 ----------------
storage:
  upload-dir: ./uploads
  allowed-ext: jpg,jpeg,png,webp,pdf
  max-size: 20971520
  public-prefix: /api/file/download/

logging:
  level:
    root: info
    com.agri.trace: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
