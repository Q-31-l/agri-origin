server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agri-origin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 生产环境用 DB_PASSWORD 覆盖（systemd EnvironmentFile 注入），本地默认 root
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: AgriHikariPool
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.agri.trace.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- JWT ----------------
jwt:
  # 生产环境务必用 JWT_SECRET 覆盖（openssl rand -hex 32），下面的默认值只用于本地开发
  secret: ${JWT_SECRET:agri-origin-fisco-bcos-traceability-secret-key-2026}
  # 访问令牌有效期（小时）
  expire-hours: 12
  # 刷新令牌有效期（天）：access token 过期后前端静默换发，用户无感
  refresh-expire-days: 7
  header: Authorization
  prefix: "Bearer "

# ---------------- FISCO-BCOS ----------------
# enabled=false 为演示模式：业务可跑通，但所有存证标记为 SKIPPED，绝不伪造"存证成功"
chain:
  enabled: true
  config-file: classpath:fisco/config.toml
  group-id: 1
  contract-address: ""
  abi-path: classpath:contracts/Traceability.abi
  private-key: ""
  # true：上链失败抛出异常并回滚业务事务；false：落库但标记 FAILED
  strict: true
  timeout-ms: 5000

# ---------------- 本地文件存储 ----------------
storage:
  upload-dir: ./uploads
  # 图片 / 报告 / 现场视频（异常处置与环节实证可上传视频）
  allowed-ext: jpg,jpeg,png,webp,pdf,mp4,mov,m4v,webm
  max-size: 104857600
  public-prefix: /api/file/download/

# ---------------- 溯源二维码 ----------------
app:
  # 二维码内容 = 该前缀 + 溯源码，指向 H5 溯源页
  trace-url-prefix: ${TRACE_URL_PREFIX:http://localhost:5173/pages/trace/index?code=}
  # ---------------- 微信登录（小程序 + App 双端） ----------------
  # 任一端未填 appid/secret（或 mock-enabled=true）时，该端进入 mock 模式：
  # 不请求微信服务器，使用该端固定模拟 openid，可完整验证「首次绑定 → 直接登录」链路。
  # 真机联调：小程序填小程序后台的 AppID/AppSecret；App 填开放平台移动应用的 AppID/AppSecret。
  # 注意两端 appid 不同、换回的 openid 也不同，服务端分列存储（wx_openid / wx_app_openid）。
  wx:
    # 小程序（sns/jscode2session）
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # App / 移动应用（sns/oauth2/access_token）
    app-appid: ${WX_APP_APPID:}
    app-secret: ${WX_APP_SECRET:}
    # 显式强制 mock，一般保持 false，靠 appid/secret 是否为空自动判断即可
    mock-enabled: ${WX_MOCK:false}
    timeout-ms: 5000

logging:
  level:
    root: info
    com.agri.trace: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
