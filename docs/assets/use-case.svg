    <ellipse cx="590" cy="470" rx="150" ry="26" fill="#fdf0e3" stroke="#e0b078"/>
    <text x="590" y="475" fill="#8a5a1f">物流交接登记</text>
    <ellipse cx="590" cy="530" rx="150" ry="26" fill="#f3ecfb" stroke="#a98ed6"/>
    <text x="590" y="535" fill="#5b3f8a">销售登记</text>
    <ellipse cx="590" cy="590" rx="150" ry="26" fill="#fdeaea" stroke="#d97777"/>
    <text x="590" y="595" fill="#b03a36">异常批次熔断</text>
    <ellipse cx="590" cy="650" rx="150" ry="26" fill="#fdeaea" stroke="#d97777"/>
