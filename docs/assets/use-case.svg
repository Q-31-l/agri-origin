    <ellipse cx="590" cy="770" rx="150" ry="26" fill="#eaf6f2" stroke="#7cc4a0"/>
    <text x="590" y="775" fill="#1f6f4a">溯源查询与扫码验真</text>
    <ellipse cx="590" cy="830" rx="150" ry="26" fill="#eef1f6" stroke="#9aabc0"/>
    <text x="590" y="835" fill="#455a70">用户与基础数据管理</text>
