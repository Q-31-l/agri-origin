<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1012" viewBox="0 0 1180 1012" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif">
  <rect x="0" y="0" width="1180" height="1012" fill="#ffffff"/>

  <text x="590" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3a2c">角色用例图</text>
  <text x="590" y="66" text-anchor="middle" font-size="12.5" fill="#7a8b83">8 类角色分级授权，所有用例均先经登录认证与权限拦截（RBAC + 数据范围双层校验）</text>

  <!-- 系统边界 -->
