  <g font-size="12.5" text-anchor="middle">
    <ellipse cx="590" cy="170" rx="150" ry="26" fill="#e8f5ee" stroke="#7cc4a0"/>
    <text x="590" y="175" fill="#1f6f4a">批次建档（编码 + 溯源码）</text>
    <ellipse cx="590" cy="230" rx="150" ry="26" fill="#e8f5ee" stroke="#7cc4a0"/>
    <text x="590" y="235" fill="#1f6f4a">农事记录登记</text>
    <ellipse cx="590" cy="290" rx="150" ry="26" fill="#e8f5ee" stroke="#7cc4a0"/>
