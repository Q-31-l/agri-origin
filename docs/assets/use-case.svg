    <ellipse cx="590" cy="350" rx="150" ry="26" fill="#fdf6e6" stroke="#dfc078"/>
    <text x="590" y="355" fill="#8a6a1f">村级核验</text>
    <ellipse cx="590" cy="410" rx="150" ry="26" fill="#e6f0fb" stroke="#7aa7e0"/>
