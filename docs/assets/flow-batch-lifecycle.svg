<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a5b52"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#c0504d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <text x="590" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3a2c">农产品批次全生命周期业务流程图</text>
  <text x="590" y="66" text-anchor="middle" font-size="12.5" fill="#7a8b83">种植 → 采收 → 核验 → 检测 → 运输 → 销售 → 溯源查询　｜　每个节点写入即上链存证，质检不合格立即熔断</text>

  <text x="160" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a9a92">责任主体</text>
  <text x="470" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a9a92">业务节点与链上动作</text>
  <text x="915" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a9a92">异常熔断与处置分支</text>

  <!-- 泳道 -->
  <rect x="20" y="120" width="1140" height="600" rx="10" fill="#fbfdfc" stroke="#e3ece7"/>
  <line x1="290" y1="120" x2="290" y2="720" stroke="#e8f0ec" stroke-dasharray="4 4"/>
  <line x1="682" y1="120" x2="682" y2="720" stroke="#e8f0ec" stroke-dasharray="4 4"/>

  <!-- ============ 节点 ============ -->
  <!-- 1 批次建档 -->
  <g>
    <rect x="300" y="140" width="340" height="66" rx="8" fill="#e8f5ee" stroke="#7cc4a0" stroke-width="1.4"/>
    <text x="470" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f4a">① 批次建档</text>
    <text x="470" y="182" text-anchor="middle" font-size="11" fill="#5a7a6b">生成唯一批次编码 + 溯源二维码</text>
    <text x="470" y="198" text-anchor="middle" font-size="10" fill="#93a8a0">registerBatch()　状态 → PLANTING</text>
    <line x1="470" y1="206" x2="470" y2="220" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 2 农事 -->
  <g>
    <rect x="300" y="222" width="340" height="66" rx="8" fill="#e8f5ee" stroke="#7cc4a0" stroke-width="1.4"/>
    <text x="470" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f4a">② 农事记录登记</text>
    <text x="470" y="264" text-anchor="middle" font-size="11" fill="#5a7a6b">整地 / 定植 / 施肥 / 病虫害防治，可附照片</text>
    <text x="470" y="280" text-anchor="middle" font-size="10" fill="#93a8a0">addRecord(type=PLANTING)　照片 SHA-256</text>
    <line x1="470" y1="288" x2="470" y2="302" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 3 采收 -->
  <g>
    <rect x="300" y="304" width="340" height="66" rx="8" fill="#e8f5ee" stroke="#7cc4a0" stroke-width="1.4"/>
    <text x="470" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f4a">③ 采收登记</text>
    <text x="470" y="346" text-anchor="middle" font-size="11" fill="#5a7a6b">数量 / 等级 / 天气，一个批次仅一条</text>
    <text x="470" y="362" text-anchor="middle" font-size="10" fill="#93a8a0">addRecord(type=HARVEST)　→ HARVESTED</text>
    <line x1="470" y1="370" x2="470" y2="384" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 4 核验 -->
  <g>
    <rect x="300" y="386" width="340" height="66" rx="8" fill="#fdf6e6" stroke="#dfc078" stroke-width="1.4"/>
    <text x="470" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6a1f">④ 村级核验</text>
    <text x="470" y="428" text-anchor="middle" font-size="11" fill="#7a6a3f">资料属实性审核，通过 / 驳回并留意见</text>
    <text x="470" y="444" text-anchor="middle" font-size="10" fill="#a89a72">审核结果上链　audit_status → APPROVED</text>
    <line x1="470" y1="452" x2="470" y2="466" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 5 质检 -->
  <g>
    <rect x="300" y="468" width="340" height="66" rx="8" fill="#e6f0fb" stroke="#7aa7e0" stroke-width="1.4"/>
    <text x="470" y="491" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4f8a">⑤ 质量检测</text>
    <text x="470" y="510" text-anchor="middle" font-size="11" fill="#4f6f96">上传报告原文件，计算文件摘要与业务摘要</text>
    <text x="470" y="526" text-anchor="middle" font-size="10" fill="#7e97b5">addRecord(type=QUALITY)　报告号唯一</text>
    <line x1="470" y1="534" x2="470" y2="548" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 合格标记 -->
  <rect x="440" y="536" width="60" height="21" rx="10" fill="#e6f7ee" stroke="#7cc4a0"/>
  <text x="470" y="551" text-anchor="middle" font-size="11" fill="#1f6f4a">合格</text>

  <!-- 6 物流 -->
  <g>
    <rect x="300" y="550" width="340" height="66" rx="8" fill="#fdf0e3" stroke="#e0b078" stroke-width="1.4"/>
    <text x="470" y="573" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a1f">⑥ 物流交接</text>
    <text x="470" y="592" text-anchor="middle" font-size="11" fill="#7a6a3f">承运主体 / 车牌 / 冷链温度 / 交接签收</text>
    <text x="470" y="608" text-anchor="middle" font-size="10" fill="#a8906f">addRecord(type=LOGISTICS)　仅合格批次可发运</text>
    <line x1="470" y1="616" x2="470" y2="630" stroke="#4a5b52" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <!-- 7 销售 -->
  <g>
    <rect x="300" y="632" width="340" height="66" rx="8" fill="#f3ecfb" stroke="#a98ed6" stroke-width="1.4"/>
    <text x="470" y="655" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3f8a">⑦ 销售登记</text>
    <text x="470" y="674" text-anchor="middle" font-size="11" fill="#6b5a8a">销售商 / 市场 / 价格 / 数量 / 购买方</text>
    <text x="470" y="690" text-anchor="middle" font-size="10" fill="#8f81a8">addRecord(type=SALES)　→ ON_SALE / SOLD</text>
  </g>

  <!-- ============ 左侧角色 ============ -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="50" y="160" width="180" height="26" rx="13" fill="#eef7f1" stroke="#a9d4bc"/>
    <text x="140" y="177" fill="#2f6b4f">农户 / 生产主体</text>
    <rect x="50" y="242" width="180" height="26" rx="13" fill="#eef7f1" stroke="#a9d4bc"/>
    <text x="140" y="259" fill="#2f6b4f">农户</text>
    <rect x="50" y="324" width="180" height="26" rx="13" fill="#eef7f1" stroke="#a9d4bc"/>
    <text x="140" y="341" fill="#2f6b4f">农户</text>
    <rect x="50" y="406" width="180" height="26" rx="13" fill="#fdf6e6" stroke="#dfc078"/>
    <text x="140" y="423" fill="#8a6a1f">村级管理员</text>
    <rect x="50" y="488" width="180" height="26" rx="13" fill="#e6f0fb" stroke="#7aa7e0"/>
    <text x="140" y="505" fill="#1f4f8a">检测机构</text>
    <rect x="50" y="570" width="180" height="26" rx="13" fill="#fdf0e3" stroke="#e0b078"/>
    <text x="140" y="587" fill="#8a5a1f">物流企业</text>
    <rect x="50" y="652" width="180" height="26" rx="13" fill="#f3ecfb" stroke="#a98ed6"/>
    <text x="140" y="669" fill="#5b3f8a">销售商</text>
  </g>
  <!-- 角色到节点连线 -->
  <g stroke="#cfdcd6" stroke-width="1.2">
    <line x1="230" y1="173" x2="300" y2="173"/>
    <line x1="230" y1="255" x2="300" y2="255"/>
    <line x1="230" y1="337" x2="300" y2="337"/>
    <line x1="230" y1="419" x2="300" y2="419"/>
    <line x1="230" y1="501" x2="300" y2="501"/>
    <line x1="230" y1="583" x2="300" y2="583"/>
    <line x1="230" y1="665" x2="300" y2="665"/>
  </g>

  <!-- ============ 异常分支 ============ -->
  <line x1="640" y1="501" x2="700" y2="501" stroke="#c0504d" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="645" y="474" width="52" height="20" rx="10" fill="#fdeaea" stroke="#d97777"/>
  <text x="671" y="489" text-anchor="middle" font-size="10.5" fill="#b03a36">不合格</text>

  <g>
    <rect x="702" y="462" width="428" height="78" rx="8" fill="#fdeaea" stroke="#d97777" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="916" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a36">熔断锁定　markAbnormal()</text>
    <text x="916" y="507" text-anchor="middle" font-size="11" fill="#96514d">批次状态 → ABNORMAL，abnormal_flag = 1，自动生成处置任务</text>
    <text x="916" y="525" text-anchor="middle" font-size="11" fill="#96514d">拒绝后续发运与销售写入，线上接口返回 409 状态冲突</text>
  </g>
  <line x1="916" y1="540" x2="916" y2="562" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="702" y="564" width="428" height="76" rx="8" fill="#fdeaea" stroke="#d97777" stroke-width="1.5"/>
    <text x="916" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a36">异常处置与追溯定责（监管人员）</text>
    <text x="916" y="609" text-anchor="middle" font-size="11" fill="#96514d">封存产品 / 抽样复检 / 回溯上游农事与投入品 / 追踪下游销售去向</text>
    <text x="916" y="627" text-anchor="middle" font-size="11" fill="#96514d">按环节认定责任主体，输出处置结论</text>
  </g>
  <line x1="916" y1="640" x2="916" y2="660" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="702" y="662" width="428" height="40" rx="8" fill="#fff5f5" stroke="#e8b4b2" stroke-dasharray="4 3"/>
    <text x="916" y="680" text-anchor="middle" font-size="11" fill="#b03a36">处置结果摘要上链（disposeAbnormal），原始记录保留不覆盖</text>
    <text x="916" y="696" text-anchor="middle" font-size="10.5" fill="#a86b68">录入错误的更正走「追加更正说明」通道，不删除历史</text>
  </g>

  <!-- ============ 底部：查询与校验 ============ -->
  <rect x="20" y="736" width="1140" height="120" rx="10" fill="#f7fbf9" stroke="#dfece5"/>
  <text x="46" y="764" font-size="13" font-weight="700" fill="#1f6f4a">⑧ 溯源查询与一致性校验</text>

  <g>
    <rect x="46" y="778" width="252" height="58" rx="8" fill="#ffffff" stroke="#a9d4bc"/>
    <text x="172" y="801" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b4f">消费者扫码</text>
    <text x="172" y="820" text-anchor="middle" font-size="10.5" fill="#7a8b83">扫描溯源码查看完整履历与交易凭证</text>
  </g>
  <g>
    <rect x="314" y="778" width="252" height="58" rx="8" fill="#ffffff" stroke="#a9d4bc"/>
    <text x="440" y="801" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b4f">监管按维度检索</text>
    <text x="440" y="820" text-anchor="middle" font-size="10.5" fill="#7a8b83">按批次 / 主体 / 时间范围查询</text>
  </g>
  <g>
    <rect x="582" y="778" width="252" height="58" rx="8" fill="#ffffff" stroke="#a9d4bc"/>
    <text x="708" y="801" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b4f">节点追加存证</text>
    <text x="708" y="820" text-anchor="middle" font-size="10.5" fill="#7a8b83">每次写入返回交易回执与区块高度</text>
  </g>
  <g>
    <rect x="850" y="778" width="278" height="58" rx="8" fill="#fffaf0" stroke="#dfc078"/>
    <text x="989" y="801" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6a1f">链上链下一致性校验</text>
    <text x="989" y="820" text-anchor="middle" font-size="10.5" fill="#7a8b83">摘要重算比对，篡改可被检出</text>
  </g>

  <text x="590" y="888" text-anchor="middle" font-size="11" fill="#9aaaa2">图 1　农产品批次全生命周期业务流程图（含质检不合格熔断分支）</text>
</svg>
