<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no' +
          (coverSupport ? ',viewport-fit=cover' : '') +
          '" />'
      )
    </script>
    <title>农安链溯源</title>
    <style>
      /*
        从官网点「进入业务系统」过来时，官网那层遮罩是深色的，
        但新文档在 SPA 挂载前会先按页面配置的底色（#f4f6f8）刷一帧，
        实测有 40~60ms 的浅色闪，肉眼看就是"两层之间闪了一下白"。
        这里用 html 上的 agri-boot 标记，在解析阶段就把底色压成品牌深绿；
        启动页挂载后自己摘掉这个 class，不会影响其他页面的正常底色。
      */
      html.agri-boot,
      html.agri-boot body {
        background: #0b3d26;
      }

      /*
        从官网点「进入业务系统」过来时，门户那层过场已经播了一遍（标识 + 名称 + 进度条走满）。
        但新文档从「HTML 到达」到「SPA 挂载」之间还有 300~500ms，这段时间 #app 是空的，
        用户看到的就是：过场播完 → 黑一下 → 同一块画面再出来一遍，也就是"播了两遍"。

        下面这张幕布是门户遮罩的静态同构版：尺寸、间距、颜色、渐变全部逐像素对齐，
        解析到 body 就画出来（早于任何 JS），SPA 挂载后再由启动页摘掉。
        它不参与任何逻辑，只在 html.agri-boot 存在时显示，其他情况 display:none。
      */
      #agri-curtain {
        display: none;
      }
      /*
        .cu-on 让幕布可以在收尾时"重新盖回来"，盖的是已经切过去的目标页。
        换手流程：启动页最后一帧 → 幕布盖上来（同构，看不出换手）→ reLaunch →
        目标页在下面画好 → 幕布淡出 0.52s 露出目标页。
        这样全程没有"先铺一块浅色再等页面"的中间态，也就不会闪。
      */
      #agri-curtain.cu-on {
        display: flex;
        opacity: 1;
      }
      #agri-curtain.cu-fade {
        transition: opacity 0.52s cubic-bezier(0.33, 0, 0.2, 1);
      }
      #agri-curtain.cu-out {
        opacity: 0 !important;
      }
      /*
        内容（标识 / 名称 / 条 / 提示）比底色退得快：
        底色慢慢化开的同时，标识和"正在进入业务系统"先淡掉，
        否则半透明时会浮在新页面上，看着又像叠了两层。
      */
      #agri-curtain.cu-out .ac-mark,
      #agri-curtain.cu-out .ac-name,
      #agri-curtain.cu-out .ac-bar,
      #agri-curtain.cu-out .ac-tip {
        opacity: 0;
        transition: opacity 0.18s ease-out;
      }
      /* 呼吸动画会盖掉上面这行 transition，退场时必须先停掉 */
      #agri-curtain.cu-out .ac-mark {
        animation: none;
      }
      html.agri-boot #agri-curtain,
      #agri-curtain.cu-on {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: radial-gradient(120% 100% at 50% 0%, #123528 0%, #0b1e17 58%, #070f0c 100%);
      }
      #agri-curtain .ac-mark {
        width: clamp(72px, 9vw, 104px);
        height: clamp(72px, 9vw, 104px);
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.5));
        /* 等待 JS 到达时画面不能是"死"的：标识轻微呼吸，和启动页的呼吸光晕同频 */
        animation: acBreath 2.8s ease-in-out infinite;
      }
      @keyframes acBreath {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.9;
        }
      }
      #agri-curtain .ac-name {
        margin-top: 20px;
        font-size: clamp(15px, 1.5vw, 19px);
        letter-spacing: 0.18em;
        font-weight: 600;
        color: #e8fff3;
      }
      #agri-curtain .ac-bar {
        margin-top: 28px;
        width: clamp(150px, 17vw, 212px);
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #agri-curtain .ac-bar i {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 3px;
        overflow: hidden;
        background: linear-gradient(90deg, #45e0a6, #d6ffe9);
        box-shadow: 0 0 12px rgba(69, 224, 166, 0.55);
      }
      /*
        满格的条上有一道柔光一直在扫。
        这一段是"新文档已到达、JS 还在下载"的空窗期，画面必须保持活着，
        否则用户看到的是一张纹丝不动的图 —— 那正是他说的"像固定截图一样"。
      */
      #agri-curtain .ac-bar i::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 46%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.75) 45%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(255, 255, 255, 0.75) 55%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: acSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }
      @keyframes acSweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #agri-curtain .ac-mark,
        #agri-curtain .ac-bar i::after {
          animation: none;
        }
      }
      #agri-curtain .ac-tip {
        margin-top: 16px;
        font-size: clamp(11px, 1vw, 12.5px);
        letter-spacing: 0.16em;
        color: rgba(224, 255, 238, 0.55);
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('agri_portal_hop') === '1') {
          document.documentElement.className += ' agri-boot'
        }
      } catch (e) {}
    </script>
    <script>
      /*
        幕布的三段口子，给启动页调用（它只认 window.__agriCurtain，不关心内部实现）：
          hold()      把幕布重新盖上来（与接力画面同构，看不出换手）
          release(d)  d 毫秒后开始淡出，淡完彻底摘掉，同时恢复浅色页面底
          off()       立刻收掉（启动页挂载时用：幕布交给页面自己画）
        用 element.classList 而不是改 html 的 class，是为了让"首帧幕布"和
        "收尾幕布"互不干扰 —— 首帧靠 html.agri-boot，收尾靠 .cu-on。
      */
      window.__agriCurtain = (function () {
        var el = null
        var timer = 0
        function get() {
          if (!el || !el.parentNode) el = document.getElementById('agri-curtain')
          return el
        }
        function unlockBg() {
          try {
            document.documentElement.className = document.documentElement.className
              .replace(/\s*\bagri-boot\b/g, '')
              .trim()
          } catch (e) {}
        }
        return {
          hold: function () {
            var e = get()
            if (!e) return
            clearTimeout(timer)
            e.classList.remove('cu-fade', 'cu-out')
            e.classList.add('cu-on')
          },
          release: function (delay, dur) {
            var e = get()
            if (!e) return
            timer = setTimeout(function () {
              var n = get()
              if (!n) return
              n.style.transition = 'opacity ' + (dur || 520) + 'ms cubic-bezier(0.33, 0, 0.2, 1)'
              n.classList.add('cu-fade')
              // 强制一帧再改 opacity，保证 transition 真的跑起来
              void n.offsetWidth
              n.classList.add('cu-out')
              timer = setTimeout(function () {
                var x = get()
                if (x) {
                  x.classList.remove('cu-on', 'cu-fade', 'cu-out')
                  x.style.transition = ''
                }
                unlockBg()
              }, (dur || 520) + 80)
            }, delay || 0)
          },
          off: function () {
            var e = get()
            if (!e) return
            clearTimeout(timer)
            e.classList.remove('cu-on', 'cu-fade', 'cu-out')
            unlockBg()
          }
        }
      })()
    </script>
    <!-- 站点图标直接用品牌矢量产出的 PNG，避免额外维护一份 ico -->

    <link rel="apple-touch-icon" href="/static/logo/mark.png" />

  </head>

      <div class="ac-name">农安链溯源</div>
      <div class="ac-bar"><i></i></div>
