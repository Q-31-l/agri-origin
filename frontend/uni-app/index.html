<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no' +
          (coverSupport ? ',viewport-fit=cover' : '') +
          '" />'
      )
    </script>
    <title>农安链溯源</title>
    <style>
      /*
        从官网点「进入业务系统」过来时，官网那层遮罩是深色的，
        但新文档在 SPA 挂载前会先按页面配置的底色（#f4f6f8）刷一帧，
        实测有 40~60ms 的浅色闪，肉眼看就是"两层之间闪了一下白"。
        这里用 html 上的 agri-boot 标记，在解析阶段就把底色压成品牌深绿；
        启动页挂载后自己摘掉这个 class，不会影响其他页面的正常底色。
      */
      html.agri-boot,
      html.agri-boot body {
        background: #0b3d26;
      }

      /*
        从官网点「进入业务系统」过来时，门户那层过场已经播了一遍（标识 + 名称 + 进度条走满）。
        但新文档从「HTML 到达」到「SPA 挂载」之间还有 300~500ms，这段时间 #app 是空的，
        用户看到的就是：过场播完 → 黑一下 → 同一块画面再出来一遍，也就是"播了两遍"。

        下面这张幕布是门户遮罩的静态同构版：尺寸、间距、颜色、渐变全部逐像素对齐，
        解析到 body 就画出来（早于任何 JS），SPA 挂载后再由启动页摘掉。
        它不参与任何逻辑，只在 html.agri-boot 存在时显示，其他情况 display:none。
      */
      #agri-curtain {
        display: none;
      }
      html.agri-boot #agri-curtain {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: radial-gradient(120% 100% at 50% 0%, #123528 0%, #0b1e17 58%, #070f0c 100%);
      }
      #agri-curtain .ac-mark {
        width: clamp(72px, 9vw, 104px);
        height: clamp(72px, 9vw, 104px);
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.5));
      }
      #agri-curtain .ac-name {
        margin-top: 20px;
        font-size: clamp(15px, 1.5vw, 19px);
        letter-spacing: 0.18em;
        font-weight: 600;
        color: #e8fff3;
      }
      #agri-curtain .ac-bar {
        margin-top: 28px;
        width: clamp(150px, 17vw, 212px);
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #agri-curtain .ac-bar i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #45e0a6, #d6ffe9);
        box-shadow: 0 0 12px rgba(69, 224, 166, 0.55);
      }
      #agri-curtain .ac-tip {
        margin-top: 16px;
        font-size: clamp(11px, 1vw, 12.5px);
        letter-spacing: 0.16em;
        color: rgba(224, 255, 238, 0.55);
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('agri_portal_hop') === '1') {
          document.documentElement.className += ' agri-boot'
        }
      } catch (e) {}
    </script>
    <!-- 站点图标直接用品牌矢量产出的 PNG，避免额外维护一份 ico -->
    <link rel="icon" type="image/png" href="/static/logo/mark.png" />
    <link rel="apple-touch-icon" href="/static/logo/mark.png" />
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!-- 从官网过来时的接续幕布：只在 html.agri-boot 时可见，启动页挂载后摘除 -->
    <div id="agri-curtain" aria-hidden="true">
      <svg class="ac-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <defs>
      <linearGradient id="acbmBg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#3fae74"/>
      <stop offset="46%" stop-color="#1a7c48"/>
      <stop offset="100%" stop-color="#093a22"/>
      </linearGradient>
      <radialGradient id="acbmGlow" cx="26%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#b9ffd6" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#b9ffd6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b9ffd6" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="acbmSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9df0be" stop-opacity="0.38"/>
      <stop offset="46%" stop-color="#0b4a2b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#031a0e"/>
      </linearGradient>
      <linearGradient id="acbmLeafL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fe4b2"/>
      <stop offset="55%" stop-color="#d6fbe6"/>
      <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="acbmLeafR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8fe4b2"/>
      <stop offset="55%" stop-color="#d6fbe6"/>
      <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="acbmStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c2f4d8"/>
      </linearGradient>
      <clipPath id="acbmRound">
      <rect x="0" y="0" width="512" height="512" rx="150" ry="150"/>
      </clipPath>
      </defs>
      <g clip-path="url(#acbmRound)">
      <rect width="512" height="512" fill="url(#acbmBg)"/>
      <rect width="512" height="512" fill="url(#acbmGlow)"/>
      <ellipse cx="120" cy="40" rx="250" ry="200" fill="#ffffff" opacity="0.10"/>
      <path d="M-60 512 L-60 432 Q256 366 572 432 L572 512 Z" fill="url(#acbmSoil)"/>
      <path d="M-60 432 Q256 366 572 432" fill="none" stroke="#b7f7d2" stroke-opacity="0.28" stroke-width="4"/>
      <rect x="247" y="296" width="18" height="118" rx="9" fill="url(#acbmStem)"/>
      <path d="M256 296 q9 0 9 9 v100 q0 9 -9 9 q-9 0 -9 -9 v-100 q0 -9 9 -9 z" fill="#ffffff" opacity="0.35"/>
      <path d="M258 314 Q236 196 122 206 Q150 330 258 314 Z" fill="url(#acbmLeafL)"/>
      <path d="M254 314 Q276 196 390 206 Q362 330 254 314 Z" fill="url(#acbmLeafR)"/>
      <path d="M252 310 Q212 262 140 214" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
      <path d="M260 310 Q300 262 372 214" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
      <circle cx="402" cy="126" r="30" fill="none" stroke="#e6fff0" stroke-opacity="0.62" stroke-width="6"/>
      <circle cx="402" cy="126" r="10" fill="#e6fff0" fill-opacity="0.92"/>
      <rect x="3" y="3" width="506" height="506" rx="148" ry="148" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="6"/>
      </g>
      </svg>
      <div class="ac-name">农安链溯源</div>
      <div class="ac-bar"><i></i></div>
      <div class="ac-tip">正在进入业务系统</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
