# 后端日志轮转
#
# 部署位置：/etc/logrotate.d/agri-origin
#
# 为什么需要：本服务用 systemd 的 StandardOutput=append: 把 stdout/stderr 直接追加到
# backend.log，systemd 自己不做轮转；Spring Boot 也没有配置 logback 文件输出。
# 因此这个文件是唯一的轮转手段，缺失会导致日志无限增长（实测约 9MB/天，
# 按此速率一年约 3GB，会逐步吃满根分区）。
#
# 为什么用 copytruncate：systemd 始终以 O_APPEND 持有该文件的句柄，
# 直接 mv 重命名后进程仍写旧 inode，新文件永远是空的；copytruncate 先复制再截断，
# 不需要重启服务。

/opt/agri-origin/app/backend.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
