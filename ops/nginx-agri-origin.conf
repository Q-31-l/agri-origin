server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/agri-origin/web/h5;
    index index.html;

    # 前端可上传 100MB 视频/文件
    client_max_body_size 120m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # WebSocket 实时通道：必须单独声明并补 Upgrade / Connection 头。
    # 少这两个头，nginx 会把握手请求当普通 HTTP 转给后端，
    # 后端日志刷 "Handshake failed due to invalid Upgrade header"，
    # 三端"一端操作、多端同步"能力直接失效。
    location = /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API（context-path 已是 /api，原样透传）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 带哈希的静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        try_files $uri =404;
        expires 7d;
    }

    # uni-app H5 history 模式：所有未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
