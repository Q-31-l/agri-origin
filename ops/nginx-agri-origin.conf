# ---------------------------------------------------------------------------
# 农安链溯源平台 · 站点配置
# 部署到：/etc/nginx/sites-available/default（snippets 见 ops/nginx-agri-app.conf）
#
#   80  ：只服务 ACME HTTP-01 校验，其余 301 到 HTTPS
#   443 ：正式站点。浏览器只在安全上下文（HTTPS / localhost）下开放
#         navigator.mediaDevices，扫码要调摄像头就必须走这里。
#
# 为什么要强制跳 HTTPS：
#   手机端扫码 = 实时取景，而 HTTP 页面拿不到摄像头，点"扫码"只能退化成
#   "从相册选一张二维码照片"，用户会觉得功能是坏的。统一跳到 HTTPS 之后，
#   手机浏览器/微信里点扫码就是真的实时扫，不再有第二种行为。
# ---------------------------------------------------------------------------

# 裸 IP 永远没有证书，先映射成同 IP 的 sslip.io 域名再跳，否则 HTTPS 必然证书报错。
# 8.147.61.0 → 8-147-61-0.sslip.io
map $host $agri_canonical_host {
    default                                                          $host;
    "~^(?<a>\d{1,3})\.(?<b>\d{1,3})\.(?<c>\d{1,3})\.(?<d>\d{1,3})$"  "$a-$b-$c-$d.sslip.io";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 校验必须留在 80 明文且不能被跳转，否则证书续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$agri_canonical_host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 8-147-61-0.sslip.io;

    root /opt/agri-origin/web/h5;
    index index.html;

    # ----------------------------------------------------------------------
    # 官网总门户：只接管根路径与 /portal/，其余路径仍交给 H5（uni-app SPA）
    # 为什么不整体换 root：H5 的资源与路由都以 / 为基准，整体搬迁会连带
    # 影响溯源码链接（/pages/trace/index?code=…）与已生成的二维码，风险大。
    # ----------------------------------------------------------------------
    location = / {
        root /opt/agri-origin/web/portal;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /portal { return 301 /portal/; }
    location /portal/ {
        alias /opt/agri-origin/web/portal/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    ssl_certificate     /etc/nginx/ssl/agri.crt;
    ssl_certificate_key /etc/nginx/ssl/agri.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/agri-app.conf;
}
