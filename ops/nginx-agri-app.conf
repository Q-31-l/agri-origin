# 农安链溯源 · HTTP/HTTPS 共用站点配置
# 由 ops/nginx-agri-origin.conf 引入，改这里等于同时改 80 与 443。
# 部署到：/etc/nginx/snippets/agri-app.conf

client_max_body_size 120m;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# WebSocket 实时通道：必须单独声明并补 Upgrade / Connection 头。
# 少这两个头，nginx 会把握手请求当普通 HTTP 转给后端，
# 后端日志刷 "Handshake failed due to invalid Upgrade header"，
# 三端"一端操作、多端同步"能力直接失效。
location = /api/ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 后端 API（context-path 已是 /api，原样透传）
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# WeBASE-Front 可视化控制台（联盟链浏览器：区块/交易/合约/节点监控）
# 它没有内置认证，且能用节点私钥签名交易——绝不能裸奔在公网。
location /WeBASE-Front/ {
    auth_basic "WeBASE-Front";
    auth_basic_user_file /etc/nginx/.htpasswd_webase;

    proxy_pass http://127.0.0.1:5002/WeBASE-Front/;
    proxy_http_version 1.1;

    # 这个控制台是 webpack 打包的 SPA，chunk 文件名带内容哈希。
    # 但打过热补丁后「同名文件、内容变了」，浏览器启发式缓存会继续用旧文件，
    # 表现为服务端已修复、用户端还是老 bug。强制每次回源校验（有 If-Modified-Since 时仍走 304，代价极低）。
    add_header Cache-Control "no-cache" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# 带哈希的静态资源长缓存
location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
}
location /static/ {
    try_files $uri =404;
    expires 7d;
}

# uni-app H5 history 模式：所有未知路径回退到 index.html
location / {
    try_files $uri $uri/ /index.html;
}
