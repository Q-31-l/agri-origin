# 农安链溯源 · HTTP/HTTPS 共用站点配置
# 由 ops/nginx-agri-origin.conf 引入，改这里等于同时改 80 与 443。
# 部署到：/etc/nginx/snippets/agri-app.conf

client_max_body_size 120m;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# WebSocket 实时通道：必须单独声明并补 Upgrade / Connection 头。
# 少这两个头，nginx 会把握手请求当普通 HTTP 转给后端，
# 后端日志刷 "Handshake failed due to invalid Upgrade header"，
# 三端"一端操作、多端同步"能力直接失效。
location = /api/ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 后端 API（context-path 已是 /api，原样透传）
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# WeBASE-Front 可视化控制台（联盟链浏览器：区块/交易/合约/节点监控）
# 它没有内置认证，且能用节点私钥签名交易——绝不能裸奔在公网。
location /WeBASE-Front/ {
    auth_basic "WeBASE-Front";
    auth_basic_user_file /etc/nginx/.htpasswd_webase;

    proxy_pass http://127.0.0.1:5002/WeBASE-Front/;
    proxy_http_version 1.1;

    # 这个控制台是 webpack 打包的 SPA，chunk 文件名带内容哈希。
    # 但打过热补丁后「同名文件、内容变了」，浏览器启发式缓存会继续用旧文件，
    # 表现为服务端已修复、用户端还是老 bug。强制每次回源校验（有 If-Modified-Since 时仍走 304，代价极低）。
    add_header Cache-Control "no-cache" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# 带哈希的静态资源长缓存
# 文件名里的 hash 就是内容指纹，内容一变文件名就变，所以可以放心 immutable。
# 注意不要再写 expires：nginx 的 expires 会自动追加一条 Cache-Control，
# 和下面的 add_header 叠在一起会响应两个 Cache-Control 头。
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}
location /static/ {
    try_files $uri =404;
    expires 1d;
    access_log off;
}

# uni-app H5 history 模式：所有未知路径回退到 index.html。
#
# 这里必须 no-cache（每次回源校验）：
#   不设 Cache-Control 时浏览器按 etag/last-modified 做启发式缓存，可能几分钟到十几分钟。
#   发版后构建产物文件名带新 hash、旧文件已被删除，但用户手里还是缓存的旧 index.html，
#   于是引用了不存在的 chunk → uni-app 的异步路由加载失败 → 整页停在
#   「连接服务器超时，点击屏幕重试」，手动刷新（强制回源）才恢复正常。
#   加上 no-cache 之后，刷新/再次进入都会拿到最新 index.html，从源头断掉这条故障链。
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
